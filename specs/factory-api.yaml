openapi: 3.0.3
info:
  title: SwarmFactory Digital Twin API
  description: |
    ## Overview
    This API manages the lifecycle of Digital Twins (Machines) and provides access to generated Alerts.
    
    ## AI-Driven Architecture Note
    This spec serves as the Single Source of Truth for generating:
    - .NET 8 C# DTOs (Data Transfer Objects)
    - Entity Framework Core Models
    - React Frontend Interfaces
  version: 1.0.0
  contact:
    name: SwarmFactory Architect
    email: architect@swarmfactory.io

servers:
  - url: http://localhost:5000
    description: Local Development Environment

paths:
  /machines:
    get:
      summary: List all Machines
      description: Retrieves a list of all registered manufacturing machines and their current operational status.
      operationId: GetMachines
      tags:
        - Machines
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Machine'
    post:
      summary: Register a new Machine
      description: Onboards a new machine into the Digital Twin registry.
      operationId: CreateMachine
      tags:
        - Machines
      requestBody:
        description: Machine to add
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MachineInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Machine'

  /machines/{machineId}:
    get:
      summary: Get Machine by ID
      description: Returns a single machine's details.
      operationId: GetMachineById
      tags:
        - Machines
      parameters:
        - name: machineId
          in: path
          description: Unique identifier of the machine
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Machine'
        '404':
          description: Machine not found

  /alerts:
    get:
      summary: Get Active Alerts
      description: Retrieves alerts generated by the Azure Function Telemetry Processor (e.g., Overheating).
      operationId: GetAlerts
      tags:
        - Alerts
      parameters:
        - name: status
          in: query
          description: Filter by alert status (e.g., New, Acknowledged)
          schema:
            type: string
            enum: [New, Acknowledged, Resolved]
      responses:
        '200':
          description: List of alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alert'

components:
  schemas:
    # ----------------------------------------------------------------
    # Machine Entity
    # Represents a physical asset on the factory floor.
    # ----------------------------------------------------------------
    Machine:
      type: object
      required:
        - id
        - name
        - type
        - status
        - lastMaintenanceDate
      properties:
        id:
          type: string
          format: uuid
          description: Unique System ID (GUID).
        name:
          type: string
          example: "Extruder-01"
          description: Human-readable name.
        type:
          type: string
          enum: [RobotArm, ConveyorBelt, Extruder, Press]
          description: The category of the machine.
        status:
          type: string
          enum: [Online, Offline, Maintenance, Error]
          default: Online
          description: Real-time operational status.
        location:
          type: string
          example: "Building-A, Floor-2"
        lastMaintenanceDate:
          type: string
          format: date-time
          description: ISO8601 Timestamp of last service.

    # Input Schema (No ID required for creation)
    MachineInput:
      type: object
      required:
        - name
        - type
        - location
      properties:
        name:
          type: string
        type:
          type: string
          enum: [RobotArm, ConveyorBelt, Extruder, Press]
        location:
          type: string

    # ----------------------------------------------------------------
    # Alert Entity
    # Generated asynchronously by the Event Processor when thresholds are breached.
    # ----------------------------------------------------------------
    Alert:
      type: object
      properties:
        id:
          type: string
          format: uuid
        machineId:
          type: string
          format: uuid
          description: Reference to the Machine causing the alert.
        severity:
          type: string
          enum: [Low, Medium, High, Critical]
        message:
          type: string
          example: "Temperature exceeded 90°C"
        timestamp:
          type: string
          format: date-time
        status:
          type: string
          enum: [New, Acknowledged, Resolved]